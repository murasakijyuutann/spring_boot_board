<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board Home</title>
</head>
<body>
<h1>Board Posts</h1>

<p><a href="/login">Login</a> | <a href="/register">Register</a> | <a href="/posts/create">Create Post</a></p>

<ul>
    <li th:each="post : ${posts}">
        <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Post Title</a>
        — <span th:text="${post.author.nickname}"></span>
    </li>
</ul>

</body>
</html>
