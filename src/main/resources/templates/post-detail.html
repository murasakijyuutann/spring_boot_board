<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Post Detail</title>
  <style>
    body { font-family: Arial; background: #f5f6fa; }
    .card {
      width: 700px; margin: 60px auto;
      background: white; border-radius: 10px;
      padding: 30px; box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    h2 { color: #2c3e50; }
    p { line-height: 1.6; color: #444; }
    a { color: #27ae60; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2 th:text="${post.title}">Post Title</h2>
    <p><strong>Author:</strong> <span th:text="${post.authorName}"></span></p>
    <p th:text="${post.content}" style="white-space: pre-wrap;"></p>
    <p><a th:href="@{/posts}">← Back to list</a></p>
  </div>
</body>
</html>
