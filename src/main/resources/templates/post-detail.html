<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">Post Title</title>
</head>
<body>
<h1 th:text="${post.title}"></h1>
<p>by <strong th:text="${post.author.nickname}"></strong></p>
<p th:text="${post.content}"></p>

<!-- Only show delete button if current user is the author -->
<form th:if="${ownPost}" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post">
    <button type="submit">Delete Post</button>
</form>

<p><a href="/">Back to Home</a></p>
</body>
</html>
