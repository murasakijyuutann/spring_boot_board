<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Post</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; }
    .card {
      width: 700px; margin: 60px auto; background: white;
      border-radius: 10px; padding: 30px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #2c3e50; }
    label { font-weight: bold; display: block; margin: 10px 0 5px; }
    input, textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 6px; font-family: Arial; resize: vertical;
    }
    button {
      display: block; margin-top: 15px; width: 100%;
      background: #27ae60; color: white;
      border: none; border-radius: 6px; padding: 10px;
      cursor: pointer; font-weight: bold;
    }
    button:hover { background: #2ecc71; }
    a { color: #27ae60; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create a New Post</h1>
    <form action="/posts/create" method="post">
      <label>Title:</label>
      <input type="text" name="title"/>
      <label>Content:</label>
      <textarea name="content" cols="40" rows="10"></textarea>
      <button type="submit">Submit</button>
    </form>
    <p style="text-align:center; margin-top:15px;">
      <a href="/">Back to Home</a>
    </p>
  </div>
</body>
</html>
